<header class="topbar">
  <div class="logo-cell">
  <picture class="cbs-logo">
    <source media="(max-width: 819px)" srcset="{{ '/assets/cbs-mark.png' | relative_url }}">
    <img src="{{ '/assets/cbs-logo.png' | relative_url }}" alt="Columbia Business School">
  </picture>

  <p class="logo-sub logo-title">Assistant Professor of Finance</p>
  </div>

  <div class="topbar-main">
    <a class="course-brand" href="{{ '/' | relative_url }}"><span class="brand-title">{{ site.title }}</span></a>
    <nav class="topnav" id="topnav" aria-label="Main pages">
      <ul>{% for item in site.data.sections %}<li><a href="{{ item.url | relative_url }}"{% if page.section == item.slug %} aria-current="page"{% endif %}>{{ item.title }}</a></li>{% endfor %}</ul>
    </nav>
    {% include subnav.html where='subnav-top' %}
  </div>
  <button class="menu-toggle" type="button" aria-expanded="false" aria-controls="topnav">Menu <span aria-hidden="true">☰</span></button>
</header>
<aside class="site-sidebar"><nav class="page-outline" aria-label="Contents" hidden><p class="outline-title">Contents</p><ul id="outline"></ul></nav></aside>
